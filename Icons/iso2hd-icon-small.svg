<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>ISO2HD (small sizes)</title>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E25AC9"/>
      <stop offset="1" stop-color="#8E2DA8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B9CFA"/>
      <stop offset="1" stop-color="#1450B4"/>
    </linearGradient>
  </defs>
  <!-- Simplified for 16-32px: bolder shapes, no fine rings, screws or arm.
       Artwork authored around 32..224 x 48..232; scaled to fill the canvas. -->
  <g transform="translate(128 128) scale(1.25) translate(-128 -140)">
    <circle cx="94" cy="112" r="62" fill="url(#back)"/>
    <circle cx="94" cy="112" r="21" fill="#F6DDF3"/>
    <circle cx="94" cy="112" r="8" fill="#5E1B75" fill-opacity="0.8"/>

    <rect x="112" y="68" width="110" height="144" rx="14" fill="#FFFFFF" stroke="#7FA6E0" stroke-width="3"/>
    <circle cx="167" cy="122" r="40" fill="#C5D9F6"/>
    <circle cx="167" cy="122" r="12" fill="#2B7CD3"/>

    <circle cx="128" cy="190" r="42" fill="url(#badge)" stroke="#FFFFFF" stroke-width="5"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M106,190 H150 M136,174 L150,190 L136,206"/>
    </g>
  </g>
</svg>
